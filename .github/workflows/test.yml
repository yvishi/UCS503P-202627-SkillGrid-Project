name: Test

on:
  push:
    branches:
      - main
      - Dev
    paths:
      - "code/frontend/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "code/frontend/**"
      - ".github/workflows/test.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    env:
      DATABASE_URL: postgresql://x:x@localhost:5432/x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Next route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: skillgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pw@localhost:5432/skillgrid_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed skill catalog
        run: npx prisma db seed

      - name: Integration tests
        run: npm run test:integration
